<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/sidebar.css" />
        <link rel="stylesheet" href="css/dashboard.css" />
        <title>Web Client</title>
    </head>

    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="logo">
                    <img src="assets/logo/Logotipo.svg" alt="FBOT logo" />
                    <h2>FBOT</h2>
                </div>

                <div class="menu">
                    <a
                        href="#"
                        class="active"
                        onclick="navegar(event, 'dashboard')"
                    >
                        <img src="assets/sidebar/grid.svg" class="menu-icon" />
                        <span>Dashboard</span>
                    </a>
                    <a href="#" onclick="navegar(event, 'navigation')">
                        <img src="assets/sidebar/move.svg" class="menu-icon" />
                        <span>Navigation</span>
                    </a>
                    <a href="#" onclick="navegar(event, 'vision')">
                        <img
                            src="assets/sidebar/camera.svg"
                            class="menu-icon"
                        />
                        <span>Vision</span>
                    </a>
                    <a href="#" onclick="navegar(event, 'speech')">
                        <img
                            src="assets/sidebar/message-square.svg"
                            class="menu-icon"
                        />
                        <span>Speech / TTS</span>
                    </a>
                    <a href="#" onclick="navegar(event, 'emotions')">
                        <img src="assets/sidebar/smile.svg" class="menu-icon" />
                        <span>Emotions</span>
                    </a>
                    <a href="#" onclick="navegar(event, 'manipulator')">
                        <img
                            src="assets/sidebar/activity.svg"
                            class="menu-icon"
                        />
                        <span>Manipulator</span>
                    </a>
                </div>
            </aside>

            <main class="main">
                <header class="header">
                    <h1 id="page-title">Dashboard</h1>
                </header>

                <section id="page-dashboard" class="page active">
                    <section class="cards">
                        <div class="card">
                            <h3 class="card-title">
                                <img
                                    src="assets/cards/cpu.svg"
                                    class="card-icon"
                                />
                                <span>CPU</span>
                            </h3>
                            <p class="card-value" id="cpu-val">--</p>
                        </div>
                        <div class="card">
                            <h3 class="card-title">
                                <img
                                    src="assets/cards/hard-drive.svg"
                                    class="card-icon"
                                />
                                <span>Memory</span>
                            </h3>
                            <p class="card-value" id="memory-val">--</p>
                        </div>
                        <div class="card">
                            <h3 class="card-title">
                                <img
                                    src="assets/cards/wifi.svg"
                                    class="card-icon"
                                />
                                <span>Network</span>
                            </h3>
                            <p class="card-value" id="wifi-val">--</p>
                        </div>
                        <div class="card">
                            <h3 class="card-title">
                                <img
                                    src="assets/cards/radio.svg"
                                    class="card-icon"
                                />
                                <span>Nodes</span>
                            </h3>
                            <p class="card-value" id="nodes-val">--</p>
                        </div>
                        <div class="card">
                            <h3 class="card-title">
                                <img
                                    src="assets/cards/list.svg"
                                    class="card-icon"
                                />
                                <span>Topics</span>
                            </h3>
                            <p class="card-value" id="topics-val">--</p>
                        </div>
                    </section>

                    <section class="logs">
                        <h2>System Logs</h2>
                    </section>

                    <section class="power">
                        <h2>Power Control</h2>
                        <div class="power-grid">
                            <div class="power-card">
                                <h3>Jetson</h3>
                                <p>Status: --</p>
                                <button>Shutdown</button>
                            </div>
                            <div class="power-card">
                                <h3>NUC</h3>
                                <p>Status: ---</p>
                                <button>Shutdown</button>
                            </div>
                            <div class="power-card">
                                <h3>Full System</h3>
                                <p>Shutdown everything</p>
                                <button>Shutdown All</button>
                            </div>
                        </div>
                    </section>
                </section>

                <section id="page-navigation" class="page">
                    <h2>Navigation</h2>
                </section>
                <section id="page-vision" class="page">
                    <h2>Vision</h2>
                </section>
                <section id="page-speech" class="page">
                    <h2>Speech / TTS</h2>
                </section>
                <section id="page-emotions" class="page">
                    <h2>Emotions</h2>
                </section>
                <section id="page-manipulator" class="page">
                    <h2>Manipulator</h2>
                </section>
            </main>
        </div>

        <style>
            .page {
                display: none;
            }
            .page.active {
                display: contents;
            }
            .menu a {
                cursor: pointer;
            }
        </style>

        <script src="robotStatusController.js"></script>
        <script src="router.js"></script>
        <script src="main.js"></script>
    </body>
</html>
